<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f1115">
<title>Minha Dieta</title>
<style>
:root{--bg:#0f1115;--card:#1a1d23;--hover:#22262e;--text:#e8eaed;--muted:#9aa0a6;--line:#2d3138;--accent:#2dd4a7;--accent-light:#1f3d36;--danger:#f28b82;--carb:#ffb74d;--prot:#4fc3f7;--fat:#ba68c8;--fib:#81c784;--radius:16px;--small:10px}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 20% -10%,#1a2330 0%,var(--bg) 60%);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}a{color:inherit}
.app{max-width:1100px;margin:auto;padding:24px 20px}
header{display:flex;gap:20px;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap}
.brand h1{margin:0;font-size:2rem;letter-spacing:-.5px;background:linear-gradient(135deg,#fff 30%,#a5d6a7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.brand p{margin:4px 0 0;color:var(--muted);font-size:.9rem}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{padding:10px 15px;border-radius:var(--small);background:var(--card);border:1px solid var(--line);color:var(--text);font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:hover{background:var(--hover);border-color:#3a4048}.btn.primary{background:linear-gradient(135deg,#2dd4a7,#1aa179);color:#0f1115;border-color:transparent;font-weight:700}.btn.danger{color:var(--danger);border-color:#5a3b3b}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 10px 30px rgba(0,0,0,.4);padding:20px;margin-bottom:20px}
.daybar{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}.daybar label{font-weight:600;color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.5px}.daybar input[type=date]{padding:10px 14px;border:1px solid var(--line);border-radius:var(--small);background:#262a31;color:#fff}
.dash{display:flex;flex-direction:column;align-items:center;gap:22px}.kcal{width:150px;height:150px;border-radius:50%;border:5px solid transparent;background:linear-gradient(var(--card),var(--card)) padding-box,conic-gradient(var(--accent) 0deg,#2a2e35 0deg) border-box;display:flex;flex-direction:column;align-items:center;justify-content:center}.kcal strong{font-size:2.2rem;line-height:1;font-weight:700;letter-spacing:-1px}.kcal-unit{font-size:.72rem;color:#d7d9dd;margin-top:6px;text-transform:uppercase;font-weight:700;letter-spacing:.8px;white-space:nowrap}.kcal-status{font-size:.66rem;color:var(--muted);margin-top:1px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
.chart{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:100%}.macro{padding:15px;border-radius:var(--small);background:#20242b;border:1px solid var(--line);min-width:0}.macro span{color:var(--muted);font-size:.78rem;text-transform:uppercase;white-space:nowrap}.macro strong{display:block;color:#fff;font-size:1.15rem;margin:4px 0}.bar{height:6px;background:#33373f;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;border-radius:99px}
.meals{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-bottom:20px}.meal{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}.meal-head{padding:16px 18px;background:#21252c;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.meal-head strong{font-size:1.1rem}.meal-head small{color:var(--muted);background:#2a2e35;padding:4px 10px;border-radius:20px}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.item input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}.item.consumed .name{text-decoration:line-through;color:var(--muted);opacity:.7}.name{font-weight:600;color:#fff}.details{color:var(--muted);font-size:.8rem;margin-top:2px}.qty-input{width:65px;padding:8px 6px;border:1px solid var(--line);border-radius:8px;background:#262a31;text-align:center}.item-actions{display:flex;gap:5px}.icon{color:var(--muted);padding:6px 8px;border-radius:8px}.icon:hover{background:#33373f;color:#fff}.icon.delete:hover{background:#3a2525;color:var(--danger)}.empty{padding:20px;color:var(--muted);text-align:center;font-style:italic}
.menu-groups{display:flex;gap:8px;flex-wrap:wrap}.menu-group{background:transparent;border:0;overflow:visible;position:relative}.menu-group summary{cursor:pointer;padding:10px 15px;font-weight:600;list-style:none;background:var(--card);border:1px solid var(--line);border-radius:var(--small);white-space:nowrap}.menu-group summary::-webkit-details-marker{display:none}.menu-group summary:after{content:"⌄";margin-left:8px;color:var(--muted)}.menu-group[open] summary:after{content:"⌃"}.menu-group .group-actions{position:absolute;right:0;top:48px;width:250px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;z-index:5;box-shadow:0 15px 35px rgba(0,0,0,.5);display:grid;gap:8px}.group-actions .btn{width:100%;justify-content:flex-start}
.field{min-width:0}.field label{display:block;font-size:.74rem;color:var(--muted);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.35px}.field input,.field select,.field textarea{width:100%;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#262a31;color:#fff}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(45,212,167,.15)}
.notice{font-size:.8rem;color:var(--muted);margin-top:10px;background:#20242b;padding:10px 14px;border-radius:8px;border-left:3px solid var(--accent)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;padding:12px;z-index:100;backdrop-filter:blur(4px)}.modal.open{display:flex}.modal-box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);width:min(900px,100%);max-height:92vh;overflow:auto;padding:24px;box-shadow:0 20px 50px rgba(0,0,0,.6)}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.modal h2{margin:0;color:#fff;font-size:1.35rem}.modal-body{min-width:0}
.schedule-row{display:grid;grid-template-columns:minmax(0,1fr) 120px auto;gap:10px;align-items:center;margin-bottom:10px}.schedule-row>*{min-width:0}.meal-builder{background:#22262e;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}.meal-items-builder{background:#181b20;padding:14px;border-radius:10px;border:1px solid var(--line)}.item-row{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #2a2e35;font-size:.85rem}.item-row:last-child{border-bottom:0}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.form-grid .wide{grid-column:1/-1}
.tabs{display:flex;gap:8px;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:16px;overflow:auto}.tab-btn{padding:8px 14px;border-radius:8px;color:var(--muted);white-space:nowrap}.tab-btn.active{background:var(--accent-light);color:#fff;font-weight:700}
.scanner{display:grid;gap:10px}.scanner-video{width:100%;max-height:260px;object-fit:cover;border-radius:12px;background:#080a0d;border:1px solid var(--line)}.scanner-status{font-size:.82rem;color:var(--muted)}.scanner-actions{display:flex;gap:8px;flex-wrap:wrap}
.json{white-space:pre-wrap;background:#14171c;border:1px solid var(--line);border-radius:10px;padding:16px;font:12px/1.5 ui-monospace,monospace;overflow:auto;color:#a5d6a7}.json-edit{width:100%;min-height:380px;resize:vertical;background:#14171c;color:#a5d6a7;border:1px solid var(--line);border-radius:10px;padding:16px;font:12px/1.5 ui-monospace,monospace}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#fff;color:#0f1115;padding:12px 20px;border-radius:10px;display:none;z-index:200;font-weight:700;box-shadow:0 10px 25px rgba(0,0,0,.5)}.toast.show{display:block;transform:translateX(-50%) translateY(0)}
@media(max-width:900px){.chart{grid-template-columns:repeat(2,1fr)}.meals{grid-template-columns:1fr}.menu-groups{width:100%}.menu-group{flex:1}.form-grid.three{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.app{padding:12px}.brand h1{font-size:1.7rem}header{align-items:stretch;flex-direction:column}.actions{width:100%}.chart{gap:8px}.macro{padding:12px}.macro span{font-size:.72rem}.macro strong{font-size:1.08rem}.kcal{width:128px;height:128px}.kcal strong{font-size:1.9rem}.kcal-unit{font-size:.68rem}.kcal-status{font-size:.62rem}.modal{padding:8px}.modal-box{padding:16px;border-radius:14px;max-height:95vh}.schedule-row{grid-template-columns:minmax(0,1fr) minmax(95px,1fr);gap:8px}.schedule-row .btn.danger{grid-column:1/-1;width:100%}.form-grid,.form-grid.three{grid-template-columns:1fr}.item{grid-template-columns:auto minmax(0,1fr) auto}.item-actions{grid-column:2/-1}.qty-input{width:62px}.scanner-actions .btn{flex:1}.daybar{align-items:stretch}.daybar>div{width:100%}.daybar input[type=date]{width:100%}.menu-groups{flex-direction:column}.menu-group{width:100%}.menu-group summary{width:100%}.menu-group .group-actions{position:static;width:100%;margin-top:6px;box-shadow:none}}
</style>
</head>
<body>
<div class="app">
<header>
<div class="brand"><h1>Minha Dieta</h1><p>Gerenciamento simples e local da sua alimentação</p></div>
<div class="menu-groups">
<details class="menu-group"><summary>📅 Dia</summary><div class="group-actions"><button class="btn" id="todayBtn">📍 Hoje</button><button class="btn primary" id="newDayBtn">🔄 Aplicar dieta ao dia</button></div></details>
<details class="menu-group"><summary>🍽️ Dieta</summary><div class="group-actions"><button class="btn primary" id="manageDietBtn">🛠️ Configurar refeições</button><button class="btn" id="jsonDietBtn">📝 Editar dieta em JSON</button><label class="btn">📥 Importar dieta<input id="dietInput" type="file" accept=".json,application/json" hidden></label></div></details>
<details class="menu-group"><summary>📦 Backlog</summary><div class="group-actions"><button class="btn primary" id="viewBacklogBtn">📋 Ver backlog</button><button class="btn" id="addBacklogBtn">➕ Adicionar item</button></div></details>
<details class="menu-group"><summary>💾 Dados</summary><div class="group-actions"><button class="btn" id="historyBtn">📊 Histórico</button><button class="btn" id="jsonBtn">📋 Ver JSON</button><button class="btn" id="backupBtn">💾 Exportar backup</button><button class="btn danger" id="resetBtn">🗑️ Resetar aplicativo</button><label class="btn">📥 Importar backup<input id="importInput" type="file" accept=".json,application/json" hidden></label></div></details>
</div>
</header>
<section class="card"><div class="daybar"><div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><label for="datePicker">Dia selecionado</label><input id="datePicker" type="date"></div><div class="actions"><button class="btn primary" id="quickAddTop">➕ Adicionar item</button></div></div><div class="dash"><div class="kcal"><strong id="kcalVal">0</strong><span class="kcal-unit">kcal</span><span class="kcal-status">consumidas</span></div><div id="chart" class="chart"></div></div></section>
<section id="meals" class="meals" aria-label="Refeições do dia"></section>
<section class="card"><div class="daybar"><div><h2 style="margin:0;color:#fff;font-size:1.2rem">➕ Adicionar item ao dia atual</h2><div class="notice">Use a adição rápida para inserir manualmente ou buscar um produto pelo código de barras.</div></div><button class="btn primary" id="quickAddBtn">Adicionar item</button></div></section>
</div>
<div id="modal" class="modal" role="dialog" aria-modal="true"><div class="modal-box"><div class="modal-head"><h2 id="modalTitle"></h2><button class="btn" id="closeModalBtn" aria-label="Fechar">✕</button></div><div id="modalBody" class="modal-body"></div></div></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
const KEY="dietaDiaria.v2";
const DEFAULT={schemaVersion:2,name:"Minha dieta",meals:[{id:"refeicao-1",name:"Café da manhã",time:"06:00",items:[{id:"ovo",name:"Ovo de galinha cozido",qty:3,calories:78,carbs:.4,protein:6.3,fiber:0,fat:5.3}]},{id:"refeicao-2",name:"Lanche",time:"09:00",items:[]},{id:"refeicao-3",name:"Almoço",time:"12:00",items:[{id:"frango",name:"Peito de frango (porção 100g)",qty:1.5,calories:160,carbs:0,protein:30,fiber:0,fat:3.3}]},{id:"refeicao-4",name:"Lanche da tarde",time:"16:00",items:[]},{id:"refeicao-5",name:"Jantar",time:"20:00",items:[]}],backlog:[]};
let db=load(),selectedDate=today(),scannerStream=null,scannerFrame=null;
function today(){return new Date().toLocaleDateString("en-CA",{timeZone:"America/Sao_Paulo"})}
function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)}
function clone(x){return JSON.parse(JSON.stringify(x))}
function load(){try{const raw=JSON.parse(localStorage.getItem(KEY));if(raw&&raw.schemaVersion===2){if(!raw.backlog)raw.backlog=[];return raw}}catch{}return{schemaVersion:2,diet:clone(DEFAULT),backlog:[],days:{}}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function blankDayFromDiet(){return{date:selectedDate,version:1,savedAt:new Date().toISOString(),meals:db.diet.meals.map(m=>({...clone(m),items:m.items.map(i=>({...clone(i),qty:i.qty||1,consumed:false}))}))}}
function latest(){const a=db.days[selectedDate];return a&&a.length?a[a.length-1]:null}
function currentDay(){let d=latest();if(!d){d=blankDayFromDiet();db.days[selectedDate]=[d];save()}return clone(d)}
function commit(day,message="Salvo"){const arr=db.days[selectedDate]||[];day.version=(arr.at(-1)?.version||0)+1;day.savedAt=new Date().toISOString();day.date=selectedDate;db.days[selectedDate]=[...arr,clone(day)];save();render();toast(message)}
function totals(day){const t={calories:0,carbs:0,protein:0,fiber:0,fat:0};day.meals.forEach(m=>m.items.forEach(i=>{if(i.consumed){const q=Number(i.qty)||1;t.calories+=(+i.calories||0)*q;t.carbs+=(+i.carbs||0)*q;t.protein+=(+i.protein||0)*q;t.fiber+=(+i.fiber||0)*q;t.fat+=(+i.fat||0)*q}}));return t}
function fmt(n){return Number(n.toFixed(1)).toLocaleString("pt-BR")}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function toast(s){const e=document.getElementById("toast");e.textContent=s;e.classList.add("show");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("show"),1800)}
function showModal(title,body){stopScanner();modalTitle.textContent=title;modalBody.innerHTML=body;modal.classList.add("open")}
function closeModal(){stopScanner();modal.classList.remove("open")}
function renderChart(t){kcalVal.textContent=Math.round(t.calories);const pct=Math.min(100,t.calories/2500*100);document.querySelector(".kcal").style.background=`linear-gradient(var(--card),var(--card)) padding-box,conic-gradient(var(--accent) ${pct*3.6}deg,#2a2e35 0deg) border-box`;const specs=[["carbs","Carboidratos",250,"var(--carb)"],["protein","Proteínas",150,"var(--prot)"],["fat","Gorduras",70,"var(--fat)"],["fiber","Fibras",30,"var(--fib)"]];chart.innerHTML=specs.map(([k,l,target,color])=>`<div class="macro"><span>${l}</span><strong>${fmt(t[k])} g</strong><div class="bar"><i style="width:${Math.min(100,t[k]/target*100)}%;background:${color}"></i></div></div>`).join("")}
function render(){datePicker.value=selectedDate;const day=currentDay();renderChart(totals(day));meals.innerHTML=day.meals.map(m=>`<article class="meal"><div class="meal-head"><strong>${esc(m.name)}</strong><small>${esc(m.time)}</small></div>${m.items.length?m.items.map(i=>{const q=Number(i.qty)||1;return`<div class="item ${i.consumed?"consumed":""}"><input type="checkbox" ${i.consumed?"checked":""} data-action="toggle" data-id="${i.id}" data-meal="${m.id}" aria-label="Consumido"><div><div class="name">${esc(i.name)}</div><div class="details">${fmt((i.calories||0)*q)} kcal · C ${fmt((i.carbs||0)*q)}g · P ${fmt((i.protein||0)*q)}g · G ${fmt((i.fat||0)*q)}g · Fib ${fmt((i.fiber||0)*q)}g</div></div><input type="number" class="qty-input" min=".1" step=".5" value="${q}" data-action="qty" data-id="${i.id}" data-meal="${m.id}" aria-label="Quantidade">${selectedDate===today()?`<div class="item-actions"><button class="icon" data-action="edit" data-id="${i.id}" data-meal="${m.id}">✎</button><button class="icon" data-action="backlog" data-id="${i.id}" data-meal="${m.id}" title="Salvar no backlog">📦</button><button class="icon delete" data-action="delete" data-id="${i.id}" data-meal="${m.id}">×</button></div>`:""}</div>`}).join(""):`<div class="empty">Nenhum item cadastrado.</div>`}</article>`).join("")}
function openQuickAdd(){if(selectedDate!==today()){toast("Adição rápida só está disponível para hoje.");return}showModal("Adicionar item ao dia atual",`<div class="tabs"><button class="tab-btn active" id="manualTab">✎ Manual</button><button class="tab-btn" id="barcodeTab">▣ Código de barras</button></div><div id="quickContent"></div>`);const renderManual=()=>{quickContent.innerHTML=`<form id="quickForm" class="form-grid"><div class="field wide"><label>Nome do alimento</label><input id="fName" required placeholder="Ex.: Iogurte natural"></div><div class="field"><label>Quantidade base</label><input id="fQty" type="number" min=".1" step=".1" value="1" required></div><div class="field"><label>Refeição</label><select id="fMeal">${db.diet.meals.map(m=>`<option value="${m.id}">${esc(m.name)} · ${esc(m.time)}</option>`).join("")}</select></div><div class="field"><label>Calorias (base)</label><input id="fCal" type="number" min="0" step=".1" value="0" required></div><div class="field"><label>Carboidratos (g)</label><input id="fCarb" type="number" min="0" step=".1" value="0" required></div><div class="field"><label>Proteínas (g)</label><input id="fProt" type="number" min="0" step=".1" value="0" required></div><div class="field"><label>Fibras (g)</label><input id="fFib" type="number" min="0" step=".1" value="0" required></div><div class="field"><label>Gorduras (g)</label><input id="fFat" type="number" min="0" step=".1" value="0" required></div><div class="field wide"><label style="display:flex;align-items:center;gap:8px;margin-bottom:0"><input type="checkbox" id="fBacklog" style="width:auto"> Salvar também no backlog</label></div><div class="field wide"><div class="actions"><button class="btn primary" type="submit">Adicionar</button></div></div></form><div class="notice">Os valores informados são referentes à quantidade base escolhida.</div>`;quickForm.onsubmit=e=>{e.preventDefault();const itemData={name:fName.value.trim(),qty:+fQty.value||1,calories:+fCal.value||0,carbs:+fCarb.value||0,protein:+fProt.value||0,fiber:+fFib.value||0,fat:+fFat.value||0,mealId:fMeal.value};addQuickItem(itemData,fBacklog.checked)}};const renderBarcode=()=>{quickContent.innerHTML=`<div class="scanner"><div class="field"><label>Código de barras</label><input id="barcodeInput" inputmode="numeric" autocomplete="off" placeholder="Digite ou cole o código"></div><div class="scanner-actions"><button class="btn primary" id="lookupBarcode">🔎 Buscar produto</button><button class="btn" id="startScan">📷 Abrir câmera</button></div><video id="scannerVideo" class="scanner-video" playsinline muted hidden></video><div id="scannerStatus" class="scanner-status">A busca usa a base pública do Open Food Facts. O código de barras será enviado para a consulta.</div><div id="barcodeResult"></div><div class="actions"><button class="btn" id="useBarcodeManual">✎ Preencher manualmente</button></div></div>`;lookupBarcode.onclick=()=>lookupProduct(barcodeInput.value.trim());startScan.onclick=startBarcodeScanner;useBarcodeManual.onclick=renderManual};manualTab.onclick=()=>{manualTab.classList.add("active");barcodeTab.classList.remove("active");renderManual()};barcodeTab.onclick=()=>{barcodeTab.classList.add("active");manualTab.classList.remove("active");renderBarcode()};renderManual()}
function addQuickItem(data, alsoBacklog=false){const day=currentDay(),m=day.meals.find(x=>x.id===data.mealId);if(!m)return;const newItem={id:uid(),name:data.name,qty:data.qty,calories:data.calories,carbs:data.carbs,protein:data.protein,fiber:data.fiber,fat:data.fat,consumed:false,...(data.barcode?{barcode:data.barcode}:{})};m.items.push(newItem);if(alsoBacklog){db.backlog.push({...clone(newItem),qty:1})}commit(day,"Item adicionado"+(alsoBacklog?" e salvo no backlog":""));closeModal()}
async function lookupProduct(code){const clean=String(code||"").replace(/\D/g,"");if(!clean){scannerStatus.textContent="Informe um código de barras.";return}scannerStatus.textContent="Consultando Open Food Facts…";barcodeResult.innerHTML="";try{const url=`https://world.openfoodfacts.org/api/v3/product/${encodeURIComponent(clean)}?fields=product_name,brands,nutriments`;const r=await fetch(url);if(!r.ok)throw new Error("Falha na consulta");const data=await r.json();if(!data.product){scannerStatus.textContent="Produto não encontrado. Você pode preencher manualmente.";return}const p=data.product||{},n=p.nutriments||{},name=p.product_name||p.generic_name||p.brands||`Produto ${clean}`;barcodeResult.innerHTML=`<div class="card" style="margin:10px 0 0;padding:14px;background:#20242b"><strong>${esc(name)}</strong><div class="details" style="margin-top:5px">Valores nutricionais por 100 g/ml. Confira o rótulo antes de salvar.</div><form id="offForm" class="form-grid" style="margin-top:12px"><div class="field wide"><label>Nome</label><input id="offName" value="${esc(name)}" required></div><div class="field"><label>Quantidade base</label><input id="offQty" type="number" min=".1" step=".1" value="100" required></div><div class="field"><label>Refeição</label><select id="offMeal">${db.diet.meals.map(m=>`<option value="${m.id}">${esc(m.name)} · ${esc(m.time)}</option>`).join("")}</select></div><div class="field"><label>Calorias / 100 g</label><input id="offCal" type="number" min="0" step=".1" value="${Number(n["energy-kcal_100g"]||0)}"></div><div class="field"><label>Carboidratos / 100 g</label><input id="offCarb" type="number" min="0" step=".1" value="${Number(n["carbohydrates_100g"]||0)}"></div><div class="field"><label>Proteínas / 100 g</label><input id="offProt" type="number" min="0" step=".1" value="${Number(n["proteins_100g"]||0)}"></div><div class="field"><label>Fibras / 100 g</label><input id="offFib" type="number" min="0" step=".1" value="${Number(n["fiber_100g"]||0)}"></div><div class="field"><label>Gorduras / 100 g</label><input id="offFat" type="number" min="0" step=".1" value="${Number(n["fat_100g"]||0)}"></div><div class="field wide"><label style="display:flex;align-items:center;gap:8px;margin-bottom:0"><input type="checkbox" id="offBacklog" style="width:auto"> Salvar também no backlog</label></div><div class="field wide"><button class="btn primary" type="submit">Adicionar produto</button></div></form></div>`;offForm.onsubmit=e=>{e.preventDefault();addQuickItem({name:offName.value.trim(),qty:+offQty.value||100,calories:+offCal.value||0,carbs:+offCarb.value||0,protein:+offProt.value||0,fiber:+offFib.value||0,fat:+offFat.value||0,mealId:offMeal.value,barcode:clean},offBacklog.checked)};scannerStatus.textContent="Produto encontrado. Revise os valores e adicione."}catch(e){scannerStatus.textContent="Não foi possível consultar o produto. Você pode preencher manualmente."}}
async function startBarcodeScanner(){if(!( "BarcodeDetector" in window)||!navigator.mediaDevices?.getUserMedia){scannerStatus.textContent="A leitura pela câmera não é suportada neste navegador. Digite o código manualmente.";return}try{let formats=["ean_13","ean_8","upc_a","upc_e","code_128","code_39","itf","codabar"];if(BarcodeDetector.getSupportedFormats){const supported=await BarcodeDetector.getSupportedFormats();formats=formats.filter(f=>supported.includes(f));if(!formats.length)throw new Error("sem formatos")}const detector=new BarcodeDetector({formats});scannerStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}}});scannerVideo.hidden=false;scannerVideo.srcObject=scannerStream;await scannerVideo.play();scannerStatus.textContent="Aponte a câmera para o código de barras.";const scan=async()=>{if(!scannerStream)return;try{const codes=await detector.detect(scannerVideo);if(codes.length&&codes[0].rawValue){barcodeInput.value=codes[0].rawValue;stopScanner();await lookupProduct(codes[0].rawValue);return}}catch{}scannerFrame=requestAnimationFrame(scan)};scan()}catch(e){stopScanner();scannerStatus.textContent="Não foi possível abrir a câmera. Digite o código manualmente."}}
function stopScanner(){if(scannerFrame)cancelAnimationFrame(scannerFrame);scannerFrame=null;if(scannerStream){scannerStream.getTracks().forEach(t=>t.stop());scannerStream=null}const v=document.getElementById("scannerVideo");if(v)v.srcObject=null}
function openEdit(mealId,itemId){const day=currentDay(),m=day.meals.find(x=>x.id===mealId),item=m?.items.find(x=>x.id===itemId);if(!item)return;const equivalents=[];db.diet.meals.forEach(meal=>meal.items.forEach(it=>{if(it.name!==item.name)equivalents.push(it)}));db.backlog.forEach(it=>{if(it.name!==item.name)equivalents.push(it)});showModal("Editar / substituir item",`<div class="tabs"><button class="tab-btn active" id="subTab">Opções equivalentes</button><button class="tab-btn" id="manTab">Entrada manual</button></div><div id="editContent"></div>`);const manual=()=>{editContent.innerHTML=`<form id="editForm" class="form-grid"><div class="field wide"><label>Nome</label><input id="eName" value="${esc(item.name)}" required></div><div class="field"><label>Quantidade</label><input id="eQty" type="number" min=".1" step=".1" value="${item.qty||1}" required></div><div class="field"><label>Calorias</label><input id="eCal" type="number" min="0" step=".1" value="${item.calories||0}" required></div><div class="field"><label>Carboidratos</label><input id="eCarb" type="number" min="0" step=".1" value="${item.carbs||0}" required></div><div class="field"><label>Proteínas</label><input id="eProt" type="number" min="0" step=".1" value="${item.protein||0}" required></div><div class="field"><label>Fibras</label><input id="eFib" type="number" min="0" step=".1" value="${item.fiber||0}" required></div><div class="field"><label>Gorduras</label><input id="eFat" type="number" min="0" step=".1" value="${item.fat||0}" required></div><div class="field wide"><div class="actions" style="justify-content:space-between"><button type="button" class="btn" id="saveToBacklogBtn">📦 Salvar no backlog</button><button class="btn primary" type="submit">Salvar alteração</button></div></div></form>`;editForm.onsubmit=e=>{e.preventDefault();Object.assign(item,{name:eName.value.trim(),qty:+eQty.value||1,calories:+eCal.value||0,carbs:+eCarb.value||0,protein:+eProt.value||0,fiber:+eFib.value||0,fat:+eFat.value||0});commit(day,"Item atualizado");closeModal()};saveToBacklogBtn.onclick=()=>{const newItem={id:uid(),name:eName.value.trim(),qty:1,calories:+eCal.value||0,carbs:+eCarb.value||0,protein:+eProt.value||0,fiber:+eFib.value||0,fat:+eFat.value||0};db.backlog.push(newItem);save();toast("Salvo no backlog")}};const subs=()=>{editContent.innerHTML=`<div class="field"><label>Alimento substituto (dieta base + backlog)</label><select id="subSelect"><option value="">Escolha um substituto</option>${equivalents.map((x,i)=>`<option value="${i}">${esc(x.name)} (${x.calories} kcal)</option>`).join("")}</select></div><div class="actions" style="margin-top:16px"><button class="btn primary" id="applySub">Substituir</button></div>`;applySub.onclick=()=>{const x=equivalents[+subSelect.value];if(!x)return;Object.assign(item,{name:x.name,calories:+x.calories||0,carbs:+x.carbs||0,protein:+x.protein||0,fiber:+x.fiber||0,fat:+x.fat||0});commit(day,"Item substituído");closeModal()}};subTab.onclick=()=>{subTab.classList.add("active");manTab.classList.remove("active");subs()};manTab.onclick=()=>{manTab.classList.add("active");subTab.classList.remove("active");manual()};subs()}
meals.addEventListener("change",e=>{const a=e.target.dataset.action;if(!a)return;const day=currentDay(),m=day.meals.find(x=>x.id===e.target.dataset.meal),i=m?.items.find(x=>x.id===e.target.dataset.id);if(!i)return;if(a==="toggle"){i.consumed=e.target.checked;commit(day)}else if(a==="qty"){i.qty=Math.max(.1,parseFloat(e.target.value)||1);commit(day)}})
meals.addEventListener("click",e=>{const b=e.target.closest("[data-action]");if(!b)return;const day=currentDay(),m=day.meals.find(x=>x.id===b.dataset.meal),idx=m?.items.findIndex(x=>x.id===b.dataset.id);if(idx==null||idx<0)return;if(b.dataset.action==="delete"){if(confirm("Excluir este item do dia?")){m.items.splice(idx,1);commit(day,"Item excluído")}}else if(b.dataset.action==="edit")openEdit(b.dataset.meal,b.dataset.id);else if(b.dataset.action==="backlog"){const item=m.items[idx];db.backlog.push({id:uid(),name:item.name,qty:1,calories:item.calories,carbs:item.carbs,protein:item.protein,fiber:item.fiber,fat:item.fat,...(item.barcode?{barcode:item.barcode}:{})});save();toast("Item salvo no backlog")}})
function openDietEditorUI(){const d=clone(db.diet);const renderUI=()=>`<div class="field" style="margin-bottom:16px"><label>Nome da dieta base</label><input id="uiDietName" value="${esc(d.name)}"></div><div>${d.meals.map((m,i)=>`<div class="meal-builder"><div class="schedule-row"><input id="uiMealName${i}" value="${esc(m.name)}" placeholder="Nome da refeição"><input id="uiMealTime${i}" type="time" value="${esc(m.time)}"><button class="btn danger" onclick="removeMealUI(${i})">🗑️ Remover</button></div><div class="meal-items-builder"><strong style="display:block;color:var(--muted);font-size:.8rem;margin-bottom:8px">Itens cadastrados</strong>${m.items.map((it,j)=>`<div class="item-row"><span>${esc(it.name)} <small style="color:var(--muted)">(${it.qty||1} · ${it.calories} kcal)</small></span><button class="btn" onclick="removeItemUI(${i},${j})">Excluir</button></div>`).join("")}<button class="btn" style="width:100%;margin-top:10px" onclick="openDietItemForm(${i})">+ Adicionar alimento</button></div></div>`).join("")}</div><button class="btn" style="width:100%" onclick="addMealUI()">+ Adicionar nova refeição</button><div class="actions" style="margin-top:18px;justify-content:flex-end"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" id="saveDietUI">Salvar configuração</button></div>`;showModal("Configurar dieta e refeições",renderUI());window.addMealUI=()=>{d.meals.push({id:uid(),name:"Nova refeição",time:"12:00",items:[]});showModal("Configurar dieta e refeições",renderUI())};window.removeMealUI=i=>{d.meals.splice(i,1);showModal("Configurar dieta e refeições",renderUI())};window.removeItemUI=(i,j)=>{d.meals[i].items.splice(j,1);showModal("Configurar dieta e refeições",renderUI())};window.openDietItemForm=i=>{showModal("Adicionar alimento à refeição",`<form id="dietItemForm" class="form-grid"><div class="field wide"><label>Nome</label><input id="diName" required></div><div class="field"><label>Quantidade base</label><input id="diQty" type="number" min=".1" step=".1" value="1"></div><div class="field"><label>Calorias</label><input id="diCal" type="number" min="0" step=".1" value="0"></div><div class="field"><label>Carboidratos</label><input id="diCarb" type="number" min="0" step=".1" value="0"></div><div class="field"><label>Proteínas</label><input id="diProt" type="number" min="0" step=".1" value="0"></div><div class="field"><label>Fibras</label><input id="diFib" type="number" min="0" step=".1" value="0"></div><div class="field"><label>Gorduras</label><input id="diFat" type="number" min="0" step=".1" value="0"></div><div class="field wide"><div class="actions"><button type="button" class="btn" onclick="openDietEditorUI()">Cancelar</button><button class="btn primary">Adicionar</button></div></div></form>`);dietItemForm.onsubmit=e=>{e.preventDefault();d.meals[i].items.push({id:uid(),name:diName.value.trim(),qty:+diQty.value||1,calories:+diCal.value||0,carbs:+diCarb.value||0,protein:+diProt.value||0,fiber:+diFib.value||0,fat:+diFat.value||0});openDietEditorUI()}};document.getElementById("saveDietUI").onclick=()=>{d.name=uiDietName.value.trim()||"Minha dieta";d.meals.forEach((m,i)=>{const n=document.getElementById(`uiMealName${i}`),t=document.getElementById(`uiMealTime${i}`);if(n)m.name=n.value.trim()||"Refeição";if(t)m.time=t.value});db.diet=d;save();closeModal();render();toast("Dieta base atualizada")}}
function openBacklogUI(){showModal("Backlog de alternativas",`${db.backlog.length?db.backlog.map((it,i)=>`<div class="item-row"><span>${esc(it.name)} <small style="color:var(--muted)">(${it.calories} kcal)</small></span><div style="display:flex;gap:5px"><button class="btn" onclick="editBacklogItem(${i})">✎</button><button class="btn danger" onclick="removeBacklogItem(${i})">×</button></div></div>`).join(""):"<p style='color:var(--muted)'>Nenhum item no backlog. Adicione alternativas para uso rápido.</p>"}<div class="actions" style="margin-top:16px;justify-content:flex-end"><button class="btn primary" id="addBacklogFromListBtn">➕ Adicionar novo item</button></div>`);addBacklogFromListBtn.onclick=()=>openBacklogItemForm()}
function openBacklogItemForm(existingIndex=null){const it=existingIndex!==null?db.backlog[existingIndex]:{name:"",qty:1,calories:0,carbs:0,protein:0,fiber:0,fat:0};showModal(existingIndex!==null?"Editar item do backlog":"Adicionar item ao backlog",`<form id="backlogForm" class="form-grid"><div class="field wide"><label>Nome</label><input id="blName" value="${esc(it.name)}" required></div><div class="field"><label>Calorias</label><input id="blCal" type="number" min="0" step=".1" value="${it.calories}"></div><div class="field"><label>Carboidratos</label><input id="blCarb" type="number" min="0" step=".1" value="${it.carbs}"></div><div class="field"><label>Proteínas</label><input id="blProt" type="number" min="0" step=".1" value="${it.protein}"></div><div class="field"><label>Fibras</label><input id="blFib" type="number" min="0" step=".1" value="${it.fiber}"></div><div class="field"><label>Gorduras</label><input id="blFat" type="number" min="0" step=".1" value="${it.fat}"></div><div class="field wide"><div class="actions" style="justify-content:flex-end"><button type="button" class="btn" onclick="openBacklogUI()">Cancelar</button><button class="btn primary" type="submit">Salvar</button></div></div></form>`);backlogForm.onsubmit=e=>{e.preventDefault();const data={name:blName.value.trim(),qty:1,calories:+blCal.value||0,carbs:+blCarb.value||0,protein:+blProt.value||0,fiber:+blFib.value||0,fat:+blFat.value||0};if(existingIndex!==null)db.backlog[existingIndex]=data;else db.backlog.push(data);save();openBacklogUI();toast("Backlog atualizado")}}
window.editBacklogItem=i=>openBacklogItemForm(i);
window.removeBacklogItem=i=>{if(confirm("Remover este item do backlog?")){db.backlog.splice(i,1);save();openBacklogUI();toast("Item removido do backlog")}}
function openJsonEditor(){showModal("Editar dieta em JSON",`<textarea id="dietText" class="json-edit" spellcheck="false">${esc(JSON.stringify(db.diet,null,2))}</textarea><div class="actions" style="margin-top:16px;justify-content:space-between"><button class="btn" id="copyJsonBtn">📋 Copiar</button><button class="btn primary" id="saveDietJson">Salvar dieta JSON</button></div>`);copyJsonBtn.onclick=()=>navigator.clipboard?.writeText(dietText.value).then(()=>toast("Copiado"));saveDietJson.onclick=()=>{try{const x=JSON.parse(dietText.value);db.diet=x;save();closeModal();render();toast("Dieta salva")}catch(e){alert("JSON inválido: "+e.message)}}}
function viewHistoryDate(d){showModal(`Histórico — ${d}`,`<pre class="json">${esc(JSON.stringify(db.days[d],null,2))}</pre>`)}
todayBtn.onclick=()=>{selectedDate=today();render()};newDayBtn.onclick=()=>{if(confirm("Aplicar a dieta-base a este dia? Isso substituirá os itens atuais.")){db.days[selectedDate]=[blankDayFromDiet()];save();render();toast("Dieta aplicada")}};datePicker.onchange=()=>{selectedDate=datePicker.value;render()};quickAddBtn.onclick=openQuickAdd;quickAddTop.onclick=openQuickAdd;manageDietBtn.onclick=openDietEditorUI;jsonDietBtn.onclick=openJsonEditor;viewBacklogBtn.onclick=openBacklogUI;addBacklogBtn.onclick=()=>openBacklogItemForm()
backupBtn.onclick=()=>download("backup-dieta.json",{...clone(db),exportedAt:new Date().toISOString()});jsonBtn.onclick=()=>showModal("JSON da dieta atual",`<pre class="json">${esc(JSON.stringify(db.diet,null,2))}</pre>`)
historyBtn.onclick=()=>{const dates=Object.keys(db.days).sort().reverse();showModal("Histórico",dates.length?dates.map(d=>`<div class="item-row"><span>${d}</span><button class="btn" onclick="viewHistoryDate('${d}')">Ver registros</button></div>`).join(""):"<p style='color:var(--muted)'>Sem histórico.</p>")}
resetBtn.onclick=()=>{if(confirm("Isso apagará a dieta configurada, o histórico e todos os dados salvos neste navegador. Esta ação não pode ser desfeita. Exporte um backup antes se quiser preservar seus dados.")){localStorage.clear();location.reload()}}
importInput.onchange=e=>readJSON(e.target.files[0],x=>{if(x&&x.schemaVersion===2){if(!x.backlog)x.backlog=[];db=x;save();render();toast("Backup restaurado")}else alert("Backup incompatível.")});dietInput.onchange=e=>readJSON(e.target.files[0],x=>{if(x&&Array.isArray(x.meals)){db.diet=x;save();render();toast("Dieta importada")}else alert("Dieta inválida.")})
function readJSON(file,cb){if(!file)return;const r=new FileReader();r.onload=()=>{try{cb(JSON.parse(r.result))}catch(e){alert("Erro ao carregar JSON: "+e.message)}};r.readAsText(file)}
function download(name,data){const a=document.createElement("a"),b=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});a.href=URL.createObjectURL(b);a.download=name;a.click();URL.revokeObjectURL(a.href)}
closeModalBtn.onclick=closeModal;modal.onclick=e=>{if(e.target===modal)closeModal()};document.addEventListener("keydown",e=>{if(e.key==="Escape"&&modal.classList.contains("open"))closeModal()});render()
</script>
